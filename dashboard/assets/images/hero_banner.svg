<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#621E3E" />
      <stop offset="60%" stop-color="#7B254E" />
      <stop offset="100%" stop-color="#3A1024" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEC8E" />
      <stop offset="100%" stop-color="#C6C954" />
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="20" fill="url(#heroGrad)" />
  <circle cx="1080" cy="120" r="140" fill="#FFEC8E" opacity="0.06" />
  <circle cx="950" cy="180" r="80" fill="#C6C954" opacity="0.08" />
  <circle cx="1120" cy="40" r="60" fill="#667436" opacity="0.12" />

  <!-- E-Commerce Analytics Graphic on Right -->
  <g transform="translate(860, 40)" opacity="0.95">
    <!-- Card Back -->
    <rect x="0" y="0" width="280" height="160" rx="14" fill="#FFFDF0" fill-opacity="0.12" stroke="#FFEC8E" stroke-width="1.5" stroke-dasharray="2 3" />
    <!-- Mini Chart Lines -->
    <path d="M 25 120 L 70 85 L 120 100 L 170 50 L 215 70 L 255 35" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="120" r="4.5" fill="#FFEC8E" />
    <circle cx="70" cy="85" r="4.5" fill="#FFEC8E" />
    <circle cx="120" cy="100" r="4.5" fill="#FFEC8E" />
    <circle cx="170" cy="50" r="4.5" fill="#FFEC8E" />
    <circle cx="215" cy="70" r="4.5" fill="#FFEC8E" />
    <circle cx="255" cy="35" r="5" fill="#FFEC8E" />

    <!-- Shopping Bag Icon -->
    <g transform="translate(30, 25)" stroke="#FFEC8E" stroke-width="2" fill="none">
      <rect x="0" y="10" width="30" height="26" rx="4" fill="#FFEC8E" fill-opacity="0.25" />
      <path d="M 7 10 C 7 3, 23 3, 23 10" />
    </g>
    <!-- Package Icon -->
    <g transform="translate(210, 85)" stroke="#C6C954" stroke-width="1.8" fill="none">
      <polygon points="18 0, 36 9, 36 27, 18 36, 0 27, 0 9" fill="#C6C954" fill-opacity="0.2" />
      <line x1="18" y1="0" x2="18" y2="36" />
      <line x1="0" y1="9" x2="36" y2="9" />
    </g>
  </g>

  <!-- Left Editorial Branding Text -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#C6C954" fill-opacity="0.22" stroke="#C6C954" stroke-width="1" />
    <text x="84" y="17" fill="#FFEC8E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE INTELLIGENCE</text>

    <text x="0" y="68" fill="#FFFDF0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">E-Commerce Intelligence Portal</text>
    <text x="0" y="100" fill="#FFF3B0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" opacity="0.92">Live multi-dimensional analytics for orders, customer segments, product categories, and logistics.</text>

    <g transform="translate(0, 122)">
      <circle cx="6" cy="6" r="4" fill="#C6C954" />
      <text x="18" y="10" fill="#FFEC8E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Brazilian E-Commerce (Olist) Dataset · 99.4K Orders · 96.1K Customers · R$ 16.0M Gross Volume</text>
    </g>
  </g>
</svg>
